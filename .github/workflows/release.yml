# Builds the Windows installer + portable exe on every version tag (v1.0.0, v1.2.3 …)
# and attaches them, plus latest.yml for the in-app updater and the content packs, to the
# GitHub Release. Map tiles for Lighthouse are generated here from RE3MR's render, so nobody
# needs the 23 MB source PNG locally.
#
# Code signing (SignPath Foundation): switched on by adding the repository secret
# SIGNPATH_API_TOKEN and the variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and
# SIGNPATH_POLICY_SLUG. Each release then waits until the project's approver approves the
# signing request on signpath.io (an e-mail arrives); without the secret, builds stay unsigned.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    # Long enough to wait for the signing approval (SignPath waits up to ~5.5 h below).
    timeout-minutes: 360
    env:
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then echo "package.json is $PKG but tag is $TAG"; exit 1; fi

      - name: Install dependencies
        run: npm ci

      - name: Cache the Lighthouse source render
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: assets-src/lighthouse/re3mrLighthouseVERT.png
          key: re3mr-lighthouse-vert-v1

      - name: Fetch the Lighthouse render (RE3MR, CC BY-NC-SA 4.0)
        run: npm run tiles:fetch

      - name: Build Lighthouse tiles
        run: npm run tiles:lighthouse

      - name: Cache item grid images (stash scanner)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: assets-src/scan/grid-cache
          key: scan-grid-cache-${{ github.run_id }}
          restore-keys: scan-grid-cache-

      - name: Build stash scanner fingerprints
        run: npm run scan:fingerprints

      - name: Offline text reader for the scanner (Tesseract)
        run: npm run ocr:assets

      - name: Unit tests and lint
        run: |
          npm test
          npm run lint

      - name: Third-party notices
        run: npm run notices

      # Tiles and scanner data are not part of the (signed) program: they ship as content packs
      # next to it, and their SHA-256 is compiled into the app (electron/packs.ts).
      - name: Build installer, portable exe and content packs
        run: npm run dist:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload unsigned programs for signing
        if: env.SIGNING == 'true'
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned
          path: |
            release/TarkovCompanion-Setup-*.exe
            release/TarkovCompanion-*-portable.exe
          if-no-files-found: error

      - name: Sign with SignPath (waits for the approver)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 19800
          output-artifact-directory: signed

      - name: Use the signed programs and refresh the update info
        if: env.SIGNING == 'true'
        shell: bash
        run: |
          cp -f signed/*.exe release/
          node scripts/refresh-update-info.mjs release

      - name: List artifacts
        shell: bash
        run: ls -la release release-packs

      - name: Upload build artifacts (also for manual runs)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tarkov-companion-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release-packs/*.tcpack
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Tarkov Companion ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release-packs/*.tcpack
          body: |
            **Download:** `TarkovCompanion-Setup-*.exe` (installer, per-user, no admin rights) or the `-portable.exe`.
            The `.tcpack` files are downloaded by the app itself when needed (the Lighthouse map and the stash scanner data); you do not need them.

            The app only *reads* Escape from Tarkov's log files to track quests. It never touches the game.
