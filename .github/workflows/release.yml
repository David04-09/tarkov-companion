# Builds the Windows installer + portable exe on every version tag (v1.0.0, v1.2.3 …)
# and attaches them, plus latest.yml for the in-app updater, to the GitHub Release.
# Map tiles for Lighthouse are generated here from RE3MR's render, so nobody
# needs the 23 MB source PNG locally.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then echo "package.json is $PKG but tag is $TAG"; exit 1; fi

      - name: Install dependencies
        run: npm ci

      - name: Cache the Lighthouse source render
        uses: actions/cache@v4
        with:
          path: assets-src/lighthouse/re3mrLighthouseVERT.png
          key: re3mr-lighthouse-vert-v1

      - name: Fetch the Lighthouse render (RE3MR, CC BY-NC-SA 4.0)
        run: npm run tiles:fetch

      - name: Build Lighthouse tiles
        run: npm run tiles:lighthouse

      - name: Cache item grid images (stash scanner)
        uses: actions/cache@v4
        with:
          path: assets-src/scan/grid-cache
          key: scan-grid-cache-${{ github.run_id }}
          restore-keys: scan-grid-cache-

      - name: Build stash scanner fingerprints
        run: npm run scan:fingerprints

      - name: Offline text reader for the scanner (Tesseract)
        run: npm run ocr:assets

      - name: Unit tests and lint
        run: |
          npm test
          npm run lint

      - name: Build installer and portable exe
        run: npm run dist:desktop
        env:
          # Unsigned build: tell electron-builder not to look for a certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List artifacts
        shell: bash
        run: ls -la release

      - name: Upload build artifacts (also for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: tarkov-companion-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Tarkov Companion ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          body: |
            **Download:** `TarkovCompanion-Setup-*.exe` (installer, per-user, no admin rights) or the `-portable.exe`.

            Windows SmartScreen will warn once because the build is not code-signed: click **More info → Run anyway**. Later updates install from inside the app without that prompt.

            The app only *reads* Escape from Tarkov's log files to track quests. It never touches the game.
